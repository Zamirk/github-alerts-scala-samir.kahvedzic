server {
        host: "0.0.0.0",
        host = ${?HOST}

        port: "8080"
        port = ${?PORT}
}
database {
        driver: "org.postgresql.Driver"
        driver = ${?DB_DRIVER}

        url: "jdbc:postgresql://localhost:5432/fortyseven"
        url = ${?DB_URL}

        database-user: "postgres"
        database-user = ${?DB_USER}

        password: "mysecretpassword"
        password = ${?DB_PASSWORD}
}
kafka {
        server = "http://localhost:12345"
        server = ${?KAFKA_SERVER_URI}

        schema-registry {
                uri = "http://localhost:1234",
                uri = ${?KAFKA_SCHEMA_REGISTRY_URI},

                cached-schemas-per-subject = 0
                cached-schemas-per-subject = ${?KAFKA_SCHEMA_REGISTRY_CASHED_SCHEMAS_PER_SUBJECT}
        }
        topic = "subscription-topic"
        topic = ${?KAFKA_TOPIC}

        client-id = "clientId"
        client-id = ${?KAFKA_CLIENT_ID}
}
